databases:
  - name: vk-exchange-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: vk-exchange-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      sh -c "alembic upgrade head &&
      python -m app.db.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: vk-exchange-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: INITIAL_DEMO_BALANCE_MINOR
        value: "10000000"
      # Set this to your Vercel frontend URL after the first frontend
      # deploy (e.g. https://vk-exchange.vercel.app), then redeploy this
      # service — CORS rejects everything else by default.
      - key: CORS_ALLOW_ORIGINS
        value: http://localhost:5173
