databases:
  - name: vk-exchange-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: vk-exchange-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      sh -c "alembic upgrade head &&
      python -m app.db.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: vk-exchange-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: INITIAL_DEMO_BALANCE_MINOR
        value: "10000000"
      # Fixed (not generated) on purpose: this is a paper-money demo, and a
      # known admin/user login you can actually use beats a secure one you'd
      # have to go dig out of the Render dashboard. Change these if that
      # tradeoff stops making sense.
      - key: DEMO_ADMIN_EMAIL
        value: demo-admin@vkbook.app
      - key: DEMO_ADMIN_PASSWORD
        value: change-me-admin-1
      - key: DEMO_USER_EMAIL
        value: demo-user@vkbook.app
      - key: DEMO_USER_PASSWORD
        value: change-me-user-1
      # Committed directly (not left as a localhost placeholder) because
      # Render's Blueprint sync resets any dashboard-edited value for a key
      # declared here back to whatever's in this file on every push that
      # touches render.yaml — so a placeholder here silently clobbers a
      # manually-set production value the next time this file changes.
      - key: CORS_ALLOW_ORIGINS
        value: http://localhost:5173,https://vkbook.vercel.app
