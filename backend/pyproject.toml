[project]
name = "sports-exchange-backend"
version = "0.1.0"
description = "Paper-trading sports exchange simulator — backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Header() *must* live in argument defaults — that's
# the framework's DI mechanism, not the antipattern this rule targets.
ignore = ["B008"]
